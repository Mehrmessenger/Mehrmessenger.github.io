<style>
:root{--bg:#0d0c0a;--bg2:#171410;--card:#221c16;--card2:#3a2d1c;--gold:#D7AD54;--gold2:#F0CE78;--txt:#F7F3ED;--mut:#AAA39C;--err:#E0443E;--line:rgba(215,173,84,.22);--on:#11100F;color-scheme:dark}
:root[data-theme=light]{--bg:#F7F3ED;--bg2:#EFE8DC;--card:#fff;--card2:#F3E4BE;--txt:#29211D;--mut:#6B6258;--line:rgba(73,56,45,.2);color-scheme:light}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Vazirmatn,system-ui,sans-serif;background:#040403;color:var(--txt);display:flex;justify-content:center;align-items:center}
#app{position:relative;width:100%;max-width:400px;height:100%;max-height:840px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
@media(min-width:500px){#app{border-radius:36px;border:1px solid var(--line);box-shadow:0 0 0 6px #000,0 24px 70px rgba(0,0,0,.7)}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.sc{background-size:cover;background-position:center}
.welcome{justify-content:center;align-items:center;text-align:center;padding:28px;color:#fff}
.welcome:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.78))}
.welcome>*{position:relative}
.ring{width:128px;height:128px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;background:rgba(10,8,5,.55);box-shadow:0 0 40px rgba(215,173,84,.35)}
.welcome h1{font-size:46px;font-weight:800;letter-spacing:.16em;color:var(--gold2);margin-top:18px}
.welcome .s2{letter-spacing:.55em;font-size:13px}
.welcome p{margin:22px 0 28px;color:var(--gold2)}
.feats{display:flex;gap:34px;margin-bottom:40px;font-size:13px}.feats div{display:flex;flex-direction:column;align-items:center;gap:6px}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--on);font-weight:800;padding:14px;border-radius:16px;width:100%;display:flex;justify-content:center;gap:8px;align-items:center}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.logo{font-size:22px;font-weight:800;letter-spacing:.2em;flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--gold)}
.srch{margin:2px 16px 10px;background:var(--card);border-radius:14px;padding:11px 14px;display:flex;gap:10px;color:var(--mut)}
.srch input{flex:1;background:none;border:0;color:var(--txt);font:inherit;min-width:0}
.chips{display:flex;gap:8px;padding:0 16px 8px;overflow-x:auto}
.chip{padding:5px 16px;border-radius:99px;background:var(--card);color:var(--mut);font-size:13px;white-space:nowrap}.chip.on{background:var(--gold);color:var(--on);font-weight:600}
.lst{flex:1;overflow-y:auto;min-height:0}
.row{display:flex;gap:12px;align-items:center;padding:10px 16px;width:100%;text-align:start}
.row:hover{background:var(--bg2)}
.av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#11100F;flex:none;background-size:cover}
.rm{flex:1;min-width:0}.rn{font-weight:600}.rl{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:12px;color:var(--mut)}
.bd{background:var(--gold);color:var(--on);border-radius:99px;min-width:20px;padding:0 6px;text-align:center;font-weight:800;font-size:12px}
.tick{color:#4aa3ff}
.fab{position:absolute;inset-inline-end:18px;bottom:14px;width:54px;height:54px;border-radius:18px;background:var(--gold);color:var(--on);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.nav{display:flex;gap:2px;margin:6px 12px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:30px;background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.35)}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--mut);padding:7px 2px;border-radius:24px;transition:.2s}.nav button.on{color:var(--gold);background:rgba(215,173,84,.16);font-weight:700}.npa{width:22px;height:22px;border-radius:50%;background-size:cover;background-position:center;display:grid;place-items:center;font-size:12px;line-height:1}.nav button.on .npa{outline:2px solid var(--gold)}
.hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.pin{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:13px}.pin b{color:var(--gold);display:block;font-size:12px}
.msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.m{max-width:80%;padding:8px 13px;border-radius:18px;background:var(--card);line-height:1.7;align-self:flex-start;overflow-wrap:anywhere;border:1px solid transparent}
.m.me{align-self:flex-end;background:var(--card2);border-color:var(--line)}
.m small{display:flex;gap:4px;justify-content:flex-end;font-size:11px;color:var(--mut)}
.m .who{color:var(--gold);font-size:12px;font-weight:600}
.m .ph{width:240px;max-width:100%;height:170px;border-radius:12px;margin:4px 0;background-size:cover}
.vo{display:flex;align-items:center;gap:10px;min-width:210px}
.pl{width:38px;height:38px;border-radius:50%;background:var(--gold);color:var(--on);display:grid;place-items:center}
.wv{flex:1;height:26px;background:repeating-linear-gradient(90deg,var(--mut) 0 2px,transparent 2px 5px);-webkit-mask:linear-gradient(90deg,#000 var(--p,0%),rgba(0,0,0,.35) 0);mask:linear-gradient(90deg,#000 var(--p,0%),rgba(0,0,0,.35) 0)}
.day{align-self:center;font-size:12px;color:var(--mut);background:var(--card);padding:2px 14px;border-radius:99px}
.cmp{display:flex;gap:8px;align-items:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px))}
.cmp .f{flex:1;display:flex;gap:8px;align-items:center;background:var(--card);border-radius:99px;padding:0 14px;color:var(--mut);min-width:0}
.cmp input{flex:1;background:none;border:0;color:var(--txt);font:inherit;padding:12px 0;min-width:0}
.mic{width:46px;height:46px;border-radius:50%;background:var(--gold);color:var(--on);display:grid;place-items:center;flex:none}
.call{align-items:center;text-align:center;padding:56px 24px 36px;justify-content:space-between}
.call .big{width:170px;height:170px;border-radius:50%;border:3px solid var(--gold);margin:0 auto 18px;background-size:cover;box-shadow:0 0 40px rgba(215,173,84,.3)}
.call h3{font-size:30px;color:var(--gold2)}
.cb{display:flex;gap:12px;justify-content:center}
.cb button{width:66px;padding:12px 0;border-radius:20px;background:rgba(255,255,255,.1);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff}.cb button.on{background:var(--gold);color:var(--on)}
.hang{width:74px;height:74px;border-radius:50%;background:var(--err);display:grid;place-items:center;margin:26px auto 0;color:#fff}
.tabs{display:flex;gap:8px;padding:8px 16px}.tabs button{flex:1;padding:7px 4px;border-radius:99px;background:var(--card);color:var(--mut);font-size:13px}.tabs .on{background:var(--gold);color:var(--on);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 12px 14px}.grid div{aspect-ratio:1/1;border-radius:10px;background-size:cover;position:relative}
.grid span{position:absolute;bottom:6px;inset-inline-start:8px;font-size:11px;background:rgba(0,0,0,.55);padding:1px 6px;border-radius:6px;color:#fff}
.cov{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;font-size:12px}.cov b{font-size:22px;letter-spacing:.2em}
.card{margin:10px 14px;background:var(--card);border-radius:16px;padding:14px;line-height:1.8}
.set{margin:0 16px 8px;background:var(--card);border-radius:14px;padding:13px 14px;display:flex;gap:14px;align-items:center;width:calc(100% - 32px);text-align:start}
.set i{margin-inline-start:auto;font-style:normal;color:var(--mut);font-size:13px}.set svg:first-child{color:var(--gold)}
.note{margin:10px 16px 18px;padding:12px;border:1px dashed var(--line);border-radius:14px;color:var(--mut);font-size:12.5px;line-height:1.8}
.empty{padding:40px 24px;text-align:center;color:var(--mut)}
.toast{position:absolute;bottom:90px;inset-inline:22px;background:var(--card2);border:1px solid var(--gold);border-radius:14px;padding:10px 14px;text-align:center;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:9}.toast.on{opacity:1;transform:none}
.fm{padding:8px 16px 28px;display:flex;flex-direction:column;gap:12px}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mut)}
.fi{display:flex;align-items:center;background:var(--card);border:1px solid transparent;border-radius:14px;padding-inline-end:4px}
.fi:focus-within{border-color:var(--gold)}.fi:has([aria-invalid=true]){border-color:var(--err)}
.fi input,.fi textarea{flex:1;min-width:0;background:none;border:0;color:var(--txt);font:inherit;padding:13px 14px;resize:none}
.fi input:focus-visible,.fi textarea:focus-visible{outline:none}
.er{color:var(--err);font-size:12.5px;line-height:1.6}
.hint{font-size:12.5px;color:var(--mut);line-height:1.8}
.ck{display:flex;gap:10px;align-items:center;font-size:14px}.ck input{width:20px;height:20px;accent-color:var(--gold)}
.mt{display:flex;gap:4px}.mt i{flex:1;height:5px;border-radius:3px;background:var(--card2)}
.mt[data-s="1"] i:nth-child(-n+1){background:var(--err)}.mt[data-s="2"] i:nth-child(-n+2){background:#C58A36}.mt[data-s="3"] i:nth-child(-n+3){background:#7bb36b}.mt[data-s="4"] i{background:#368B66}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cg code{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;letter-spacing:.12em;color:var(--gold2)}
.btn.gh{background:none;border:1px solid var(--line);color:var(--gold);margin-top:10px}.btn:disabled{opacity:.6}
.alt{text-align:center;font-size:13.5px;color:var(--mut)}.alt button{color:var(--gold);font-weight:600;padding:0 4px}
details.hint summary{cursor:pointer;color:var(--gold)}

:root{--bg:#0a0806;--bg2:#15100b;--card:#1d1812;--card2:#4a3a1c;--line:rgba(240,206,120,.22)}
body{background:radial-gradient(90% 60% at 50% 0,#2b1d0d,#050403 72%)}
#app{background:radial-gradient(120% 50% at 50% -6%,rgba(215,173,84,.24),transparent 62%),radial-gradient(80% 36% at 100% 100%,rgba(190,120,40,.16),transparent 70%),var(--bg)}
@media(min-width:500px){#app{border-color:rgba(240,206,120,.55)}}
.lg{display:inline-block;border-radius:50%;background-image:var(--logo);background-size:cover;background-position:center;vertical-align:middle;flex:none}
.bgw{background-image:var(--bgw)}
.ring{width:136px;height:136px;padding:0;border:0;background:none;box-shadow:0 0 50px rgba(215,173,84,.45)}
.logo{display:flex;align-items:center;gap:10px}
.btn,.chip.on,.fab,.mic,.pl{background:linear-gradient(135deg,var(--gold2),var(--gold))}
.m{position:relative}.m.me{border-color:rgba(240,206,120,.4)}
.toast{z-index:40}
.sh{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.shb{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.shc{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));max-height:78%;overflow:auto}
.sa{display:flex;gap:14px;align-items:center;padding:13px 10px;border-radius:12px;width:100%;text-align:start}.sa:hover{background:var(--card)}.sa svg{color:var(--gold)}.sa.red,.sa.red svg{color:#ff8a80}
.rxr{display:flex;justify-content:space-around;padding:4px 0 10px}.rxr button{font-size:26px;padding:4px 8px}
.rq{border-inline-start:3px solid var(--gold);padding:2px 8px;margin-bottom:4px;font-size:12.5px;color:var(--mut);background:rgba(0,0,0,.2);border-radius:6px}.rq b{display:block;color:var(--gold2)}
.rx{position:absolute;bottom:-12px;inset-inline-end:10px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:0 6px;font-size:13px}
.dl{color:var(--mut)}.vt{font-size:12px;color:var(--mut)}
